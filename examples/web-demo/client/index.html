<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NATHAN-audio — démo HRTF</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230b0f14'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%231f9e8f' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23c96f18'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <h1>NATHAN-audio <span class="brand-sub">démo HRTF</span></h1>
        </div>
        <dl class="status-strip" id="statusStrip" aria-label="Statut du moteur audio">
          <div class="status-item">
            <span class="status-dot" id="hrtfDot" aria-hidden="true"></span>
            <dt>HRTF</dt><dd id="hrtfStatus">—</dd>
          </div>
          <div class="status-item"><dt>Profil</dt><dd id="profileActive">—</dd></div>
          <div class="status-item"><dt>Fréquence</dt><dd id="sampleRate">—</dd></div>
        </dl>
      </header>

      <div class="unreachable" id="unreachable" hidden role="alert">
        <p>
          Aucun serveur audio ne répond sur <code id="unreachableHost"></code>.
          Lance <code>web_demo_server</code> (voir <code>examples/web-demo/README.md</code>) puis recharge la page.
        </p>
      </div>

      <div class="layout">
        <aside class="left-col" aria-label="Profils et métriques">
          <section class="panel" aria-label="Sélecteur de profil HRTF">
            <h2>Catalogue de profils</h2>
            <div id="profileSelector"></div>
          </section>
          <section class="panel" aria-label="Métriques du moteur audio">
            <h2>Moteur audio</h2>
            <div id="metrics"></div>
          </section>
          <section class="panel" aria-label="Décodage MP3">
            <h2>Décodage MP3</h2>
            <div id="mp3panel"></div>
          </section>
        </aside>
        <main class="scene-col" id="sceneContainer" aria-label="Scène spatiale"></main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
